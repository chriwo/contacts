name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3: ['^13.4']
        php: ['8.4', '8.5']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: memory_limit=-1
          extensions: intl, mbstring, mysqli, pdo_mysql, zip
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.typo3 }}-
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        id: install
        run: |
          composer update --no-progress --no-interaction --no-audit \
              --with-all-dependencies \
              --with typo3/cms-core:'${{ matrix.typo3 }}'

      - name: Unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: composer test:php:unit

      - name: Functional tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabasePort: 3306
          typo3DatabaseName: t3func
          typo3DatabaseUsername: root
          typo3DatabasePassword: root
        run: composer test:php:functional

  qa:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          ini-values: memory_limit=-1
          extensions: intl, mbstring, mysqli, pdo_mysql, zip
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-qa-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-qa-
            composer-${{ runner.os }}-8.4-

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        id: install
        run: composer update --no-progress --no-interaction --no-audit

      - name: Coding standards
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: composer test:cgl:dry-run

      - name: PHPStan
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: composer test:phpstan:analyse -- --error-format=github --no-progress
